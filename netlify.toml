[build]
  command = "python3 -B scripts/build_pages.py --output dist/pages"
  publish = "dist/pages"

[build.environment]
  PYTHON_VERSION = "3.12"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"

[[headers]]
  for = "/seed.json"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/build-info.json"
  [headers.values]
    Cache-Control = "no-cache"
