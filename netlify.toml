[build]
command = "python3 -B scripts/build_pages.py --mode cloud --output dist/pages"
  publish = "dist/pages"

[build.environment]
PYTHON_VERSION = "3.12"
NODE_VERSION = "22"

[functions]
directory = "netlify/functions"
node_bundler = "esbuild"
included_files = ["service/ai_schema.json", "data/seed.json", "data/media/*.png", "data/media/*.wav", "web/pages-store.js"]

[[redirects]]
from = "/api/*"
to = "/.netlify/functions/api/:splat"
status = 200
force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"

[[headers]]
  for = "/seed.json"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
for = "/build-info.json"
  [headers.values]
Cache-Control = "no-cache"

[[headers]]
for = "/judge/evidence.json"
[headers.values]
Cache-Control = "no-cache"

[[headers]]
for = "/api/*"
[headers.values]
Cache-Control = "no-store"
